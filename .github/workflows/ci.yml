name: CI

# Lint, typecheck, and the prompt honesty-guard tests on every push/PR to
# main. No deploy step here — the frontend already redeploys itself via
# Cloudflare's GitHub integration (Pages) on every push; the API Worker is
# deployed manually with `npm run deploy:api` (see README "Deploying") until
# a Cloudflare API token is added as a repo secret. CI verifies the code, it
# doesn't ship the API side.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
